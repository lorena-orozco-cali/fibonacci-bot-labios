<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Fibonacci</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#C9A96E;--gold-light:#E8D5B0;--gold-dark:#A07840;--cream:#FAF7F2;--sand:#F2EBE0;--brown:#2C1F0E;--brown-mid:#5C4033;--white:#FFFFFF;--gray:#8A8078;--green:#3D6B4F;--green-light:#EAF2ED;--rose:#C0737A;--rose-light:#F9EDEF;}
html,body{height:100%;font-family:"DM Sans",sans-serif;background:var(--cream);overflow:hidden;}
.app{display:flex;flex-direction:column;width:100%;max-width:460px;height:100%;margin:0 auto;background:var(--white);}
.header{background:var(--brown);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.header-avatar{width:42px;height:42px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--brown);font-weight:500;flex-shrink:0;border:2px solid var(--gold-light);}
.header-info{display:flex;flex-direction:column;}
.header-name{font-family:"Cormorant Garamond",serif;font-size:16px;color:var(--gold-light);font-weight:500;}
.header-status{font-size:12px;color:var(--gold);display:flex;align-items:center;gap:5px;margin-top:2px;}
.dot{width:7px;height:7px;border-radius:50%;background:#4CAF50;flex-shrink:0;}
.chat-wrapper{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px;display:flex;flex-direction:column;gap:12px;background:var(--cream);}
.msg{display:flex;align-items:flex-end;gap:8px;animation:fadeUp 0.3s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg.bot{flex-direction:row;}.msg.user{flex-direction:row-reverse;}
.avatar-bot{width:28px;height:28px;border-radius:50%;background:var(--brown);display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-size:12px;color:var(--gold);font-weight:500;flex-shrink:0;}
.bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.55;}
.bubble.bot{background:var(--sand);color:var(--brown);border-bottom-left-radius:4px;}
.bubble.bot em{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:15px;color:var(--gold-dark);}
.bubble.user{background:var(--brown);color:var(--gold-light);border-bottom-right-radius:4px;}
.bubble.error{background:var(--rose-light);color:var(--rose);border:1.5px solid #E8B4B8;border-bottom-left-radius:4px;}
.typing-dots{display:flex;gap:4px;align-items:center;padding:2px 0;}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:bounce 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}
.options-row{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 2px 36px;}
.opt-btn{background:var(--white);border:1.5px solid var(--gold);color:var(--brown-mid);border-radius:20px;padding:9px 18px;font-size:13px;cursor:pointer;}
.ref-img-wrap{margin-left:36px;}
.ref-img-wrap img{width:100%;max-width:220px;border-radius:12px;border:2px solid var(--gold-light);display:block;}
.ref-label{font-size:11px;color:var(--gray);margin-top:4px;font-style:italic;}
.upload-zone{margin-left:36px;border:2px dashed var(--gold);border-radius:14px;padding:20px;text-align:center;background:var(--white);position:relative;overflow:hidden;}
.upload-zone input[type=file]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;}
.upload-icon{font-size:28px;margin-bottom:5px;}
.upload-title{font-size:13px;color:var(--brown-mid);font-weight:500;}
.upload-sub{font-size:11px;color:var(--gray);margin-top:3px;}
.photo-preview{margin-left:36px;display:flex;gap:8px;flex-wrap:wrap;}
.photo-preview img{width:85px;height:85px;object-fit:cover;border-radius:10px;border:2px solid var(--gold-light);}
.asesor-card{margin-left:36px;background:var(--green-light);border:1.5px solid var(--green);border-radius:14px;padding:14px;}
.asesor-title{font-family:"Cormorant Garamond",serif;font-size:16px;color:var(--green);font-weight:500;margin-bottom:5px;}
.asesor-sub{font-size:13px;color:#2C5040;line-height:1.55;}
.asesor-btn{margin-top:10px;background:var(--green);color:var(--white);border:none;border-radius:20px;padding:10px 20px;font-size:13px;cursor:pointer;display:inline-block;}
.input-area{flex-shrink:0;background:var(--white);border-top:1px solid var(--sand);padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;}
.txt-input{flex:1;border:1.5px solid var(--gold-light);border-radius:22px;padding:10px 14px;font-size:16px;color:var(--brown);outline:none;background:var(--cream);}
.txt-input:focus{border-color:var(--gold);}
.txt-input::placeholder{color:var(--gray);}
.send-btn{width:40px;height:40px;border-radius:50%;background:var(--brown);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.send-btn svg{width:18px;height:18px;fill:var(--gold-light);}
.branding{flex-shrink:0;font-size:10px;color:var(--gray);text-align:center;padding:6px;background:var(--white);}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-avatar">F</div>
    <div class="header-info">
      <span class="header-name">Fibonacci &middot; Dr. Esteban Pinto</span>
      <span class="header-status"><span class="dot"></span> En l&iacute;nea ahora</span>
    </div>
  </div>
  <div class="chat-wrapper" id="chat"></div>
  <div class="input-area">
    <input class="txt-input" id="userInput" placeholder="Escribe tu mensaje..." autocomplete="off"/>
    <button class="send-btn" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></button>
  </div>
  <div class="branding">Fibonacci Cl&iacute;nica Odontol&oacute;gica &middot; Dr. Esteban Pinto</div>
</div>
<script src="bot.js"></script>
</body>
</html>
